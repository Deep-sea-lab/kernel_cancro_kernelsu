name: Build Cancro Kernel

on:
  schedule:
    - cron: '0 21 * * *'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          
      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache --version
          
      - name: Download & extract Linaro GCC 4.9.4 toolchain
        run: |
          mkdir -p /opt/toolchain
          cd /opt/toolchain
          curl -L --fail --connect-timeout 30 --max-time 300 \
            https://github.com/Deep-sea-lab/kernel_cancro_kernelsu/releases/download/gcc4.9.4/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi.tar.xz \
            -o gcc.tar.xz
          tar -xJf gcc.tar.xz
          /opt/toolchain/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi/bin/arm-linux-gnueabi-gcc --version

      - name: Export build environment
        run: |
          echo "ARCH=arm" >> $GITHUB_ENV
          echo "CROSS_COMPILE=ccache /opt/toolchain/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi/bin/arm-linux-gnueabi-" >> $GITHUB_ENV
          echo "/opt/toolchain/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          arm-linux-gnueabi-gcc --version | head -n1

      - name: Generate defconfig
        run: |
          make cyanogen_cancro_defconfig

      - name: Build kernel
        run: |
          make HOSTCFLAGS="-fcommon" LOCALVERSION="-PowerBy_DeepSea" -j$(nproc)
          
      - name: Verify zImage-dtb
        run: |
          ls -lh arch/arm/boot/zImage-dtb

      - name: Verify wlan.ko
        run: |
          ls -lh drivers/staging/prima/wlan.ko

      - name: Clone AnyKernel3 and package zip
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel3
          cp arch/arm/boot/zImage-dtb anykernel3/zImage
          cd anykernel3
          rm -rf .git .github README.md LICENSE
          mkdir -p ../out
          ZIP_NAME="cancro-kernel-${{ github.run_number }}.zip"
          zip -r ../out/${ZIP_NAME} . -x ".*" -x "__MACOSX/*"
          cd ..
          cp arch/arm/boot/zImage-dtb out/
          cp drivers/staging/prima/wlan.ko out/
          echo "---" > out/version.txt
          echo "Kernel built at $(date)" >> out/version.txt
          echo "KernelSU commit: $(git -C KernelSU rev-parse --short HEAD)" >> out/version.txt
          echo "---" >> out/version.txt
          cat out/version.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cancro-kernel-${{ github.run_number }}
          path: out/
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: |
            .config
            build.log
            drivers/staging/prima/
          retention-days: 7
